name: Test Docker Compose

on:
  # Branch model: `main` is the working (dev) branch and deploys on every push with no CI in front
  # of it. Tests and checks run only on the `testing` and `prod` branches and on pull requests into
  # them. Run this workflow by hand from the Actions tab to check `main` at any time.
  push:
    branches:
      - testing
      - prod
  pull_request:
    branches:
      - testing
      - prod
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create .env from the committed template
        run: cp .env.example .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose run --rm backend bash scripts/prestart.sh
      - run: docker compose up -d --wait backend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        # The served page must be the frontend build, not merely any 200.
        run: curl -fsS http://localhost:8000 | grep -F '<title>Clinic OS</title>'
      - run: docker compose down -v --remove-orphans
